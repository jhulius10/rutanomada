version: '3.9'

# ============================================
# 🚌 RUTANÓMADA - Docker Compose (Desarrollo)
# ============================================
# Uso:
#   docker compose up -d          # Levantar servicios
#   docker compose down           # Detener servicios
#   docker compose logs -f        # Ver logs
#   docker compose ps             # Estado de servicios
# ============================================

services:
  # ============================================
  # PostgreSQL + PostGIS
  # ============================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rutanomada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rutanomada
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: rutanomada
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutanomada -d rutanomada"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rutanomada-network

  # ============================================
  # Redis (Opcional - para caché)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rutanomada-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rutanomada-network
    profiles:
      - with-redis

  # ============================================
  # Redis Commander (UI para Redis)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rutanomada-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - rutanomada-network
    profiles:
      - with-redis

  # ============================================
  # Adminer (UI para PostgreSQL)
  # ============================================
  adminer:
    image: adminer:latest
    container_name: rutanomada-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - rutanomada-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  rutanomada-network:
    driver: bridge

# ============================================
# COMANDOS ÚTILES
# ============================================
#
# Levantar solo PostgreSQL:
#   docker compose up -d postgres
#
# Levantar con Redis:
#   docker compose --profile with-redis up -d
#
# Conectar a PostgreSQL:
#   docker compose exec postgres psql -U rutanomada -d rutanomada
#
# Ver tamaño de la base de datos:
#   docker compose exec postgres psql -U rutanomada -d rutanomada -c "SELECT pg_size_pretty(pg_database_size('rutanomada'));"
#
# Backup manual:
#   docker compose exec postgres pg_dump -U rutanomada rutanomada > backup.sql
#
# Restaurar backup:
#   cat backup.sql | docker compose exec -T postgres psql -U rutanomada -d rutanomada
#
# Limpiar todo (incluyendo volúmenes):
#   docker compose down -v
#
# ============================================
